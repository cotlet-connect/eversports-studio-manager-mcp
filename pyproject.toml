[project]
name = "eversports-studio-manager-mcp"
version = "1.1.0"
description = "Connect Eversports Studio Manager to Claude Code, ChatGPT and any AI agent through Cotlet.dev, a hosted MCP server. No Eversports Studio Manager API key needed."
readme = "README.md"
license = "Elastic-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Cotlet.dev", email = "contact@cotlet.dev" }]
keywords = ["eversports studio manager", "eversports studio manager api", "eversports studio manager mcp", "mcp server", "claude", "chatgpt", "ai agent", "cotlet"]
classifiers = ["Programming Language :: Python :: 3", "Topic :: Office/Business"]
dependencies = []

[project.urls]
Homepage = "https://cotlet.dev/integrations/eversports-studio-manager-api-mcp-server?utm_source=pypi&utm_medium=package&utm_campaign=eversports-studio-manager"
Source = "https://github.com/cotlet-connect/eversports-studio-manager-mcp"

[project.scripts]
eversports-studio-manager-mcp = "eversports_studio_manager_agent:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel.force-include]
"eversports_studio_manager_agent.py" = "eversports_studio_manager_agent.py"

[tool.hatch.build.targets.sdist]
include = ["eversports_studio_manager_agent.py", "README.md", "LICENSE", "mcp.json", "Dockerfile", "glama.json", "skills", "examples", ".cursor"]
